
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Studio OS</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css"/>
<style>
:root {
  --bg: #0a0a0a;
  --card: #141414;
  --card2: #1a1a1a;
  --border: #2a2a2a;
  --gold: #c9a96e;
  --gold2: #e6c98a;
  --text: #e8e8e8;
  --muted: #888;
  --muted2: #555;
  --blue: #4a9eff;
  --purple: #a855f7;
  --amber: #f59e0b;
  --teal: #14b8a6;
  --pink: #ec4899;
  --sky: #0ea5e9;
  --gray: #6b7280;
  --red: #ef4444;
  --green: #22c55e;
  --radius: 10px;
  --radius-sm: 6px;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: var(--bg); color: var(--text); font-family: 'Georgia', serif; min-height: 100vh; font-size: 14px; }
a { color: inherit; text-decoration: none; }

/* SCROLLBAR */
::-webkit-scrollbar { width: 4px; height: 4px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

/* TOPBAR */
.topbar { display: flex; align-items: center; justify-content: space-between; padding: 0 24px; height: 56px; border-bottom: 1px solid var(--border); background: rgba(10,10,10,0.95); position: sticky; top: 0; z-index: 100; backdrop-filter: blur(10px); }
.logo { display: flex; align-items: center; gap: 10px; font-size: 16px; font-weight: 600; letter-spacing: 0.05em; color: var(--gold); }
.logo i { font-size: 20px; }
.topbar-nav { display: flex; gap: 2px; }
.nav-tab { display: flex; align-items: center; gap: 6px; padding: 6px 14px; border-radius: var(--radius-sm); font-size: 13px; color: var(--muted); cursor: pointer; transition: all 0.15s; border: none; background: none; font-family: inherit; }
.nav-tab:hover { color: var(--text); background: rgba(255,255,255,0.05); }
.nav-tab.active { color: var(--gold); background: rgba(201,169,110,0.1); }
.nav-tab i { font-size: 16px; }
.topbar-right { display: flex; gap: 8px; align-items: center; }
.btn-new { display: flex; align-items: center; gap: 6px; padding: 7px 14px; border-radius: var(--radius-sm); background: var(--gold); color: #0a0a0a; border: none; font-size: 13px; font-weight: 600; cursor: pointer; font-family: inherit; transition: all 0.15s; }
.btn-new:hover { background: var(--gold2); }
.btn-new i { font-size: 16px; }

/* MAIN */
.main { padding: 24px; max-width: 1200px; margin: 0 auto; }
.section { display: none; }
.section.active { display: block; }

/* PAGE HEADER */
.page-header { margin-bottom: 24px; }
.page-title { font-size: 22px; font-weight: 600; color: var(--text); }
.page-sub { font-size: 13px; color: var(--muted); margin-top: 4px; }

/* STAT CARDS */
.stat-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; margin-bottom: 28px; }
.stat-card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 18px 20px; }
.stat-label { font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); margin-bottom: 8px; }
.stat-value { font-size: 28px; font-weight: 600; color: var(--text); line-height: 1; }
.stat-sub { font-size: 12px; color: var(--muted); margin-top: 6px; }
.stat-card.gold .stat-value { color: var(--gold); }
.stat-card.green .stat-value { color: var(--green); }
.stat-card.blue .stat-value { color: var(--blue); }
.stat-card.purple .stat-value { color: var(--purple); }

/* SECTION TITLES */
.section-label { font-size: 11px; text-transform: uppercase; letter-spacing: 0.1em; color: var(--muted); margin-bottom: 12px; display: flex; align-items: center; gap: 8px; }
.section-label::after { content: ''; flex: 1; height: 1px; background: var(--border); }

/* BADGES */
.badge { display: inline-flex; align-items: center; padding: 2px 8px; border-radius: 99px; font-size: 11px; font-weight: 600; letter-spacing: 0.02em; }
.badge-wedding { background: rgba(201,169,110,0.15); color: var(--gold); border: 1px solid rgba(201,169,110,0.3); }
.badge-reception { background: rgba(74,158,255,0.15); color: var(--blue); border: 1px solid rgba(74,158,255,0.3); }
.badge-sangeet { background: rgba(168,85,247,0.15); color: var(--purple); border: 1px solid rgba(168,85,247,0.3); }
.badge-haldi { background: rgba(245,158,11,0.15); color: var(--amber); border: 1px solid rgba(245,158,11,0.3); }
.badge-pellikoduku { background: rgba(20,184,166,0.15); color: var(--teal); border: 1px solid rgba(20,184,166,0.3); }
.badge-pellikuthuru { background: rgba(236,72,153,0.15); color: var(--pink); border: 1px solid rgba(236,72,153,0.3); }
.badge-house-warming { background: rgba(14,165,233,0.15); color: var(--sky); border: 1px solid rgba(14,165,233,0.3); }
.badge-other { background: rgba(107,114,128,0.15); color: var(--gray); border: 1px solid rgba(107,114,128,0.3); }
.badge-done { background: rgba(34,197,94,0.15); color: var(--green); border: 1px solid rgba(34,197,94,0.3); }
.badge-pending { background: rgba(245,158,11,0.15); color: var(--amber); border: 1px solid rgba(245,158,11,0.3); }
.badge-part { background: rgba(168,85,247,0.15); color: var(--purple); border: 1px solid rgba(168,85,247,0.3); }

/* DATE BOX */
.date-box { min-width: 46px; width: 46px; height: 50px; background: var(--card2); border: 1px solid var(--border); border-radius: var(--radius-sm); display: flex; flex-direction: column; align-items: center; justify-content: center; flex-shrink: 0; }
.date-box .dd { font-size: 18px; font-weight: 700; line-height: 1; color: var(--gold); }
.date-box .mmm { font-size: 10px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); margin-top: 2px; }

/* SHOOT ROW */
.shoot-row { display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-radius: var(--radius-sm); border: 1px solid transparent; cursor: pointer; transition: all 0.15s; position: relative; }
.shoot-row:hover { background: var(--card2); border-color: var(--border); }
.shoot-row-info { flex: 1; min-width: 0; }
.shoot-row-name { font-size: 14px; font-weight: 500; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.shoot-row-meta { font-size: 12px; color: var(--muted); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.shoot-row-actions { display: flex; gap: 4px; opacity: 0; transition: opacity 0.15s; flex-shrink: 0; }
.shoot-row:hover .shoot-row-actions { opacity: 1; }
.icon-btn { background: none; border: 1px solid var(--border); border-radius: var(--radius-sm); width: 28px; height: 28px; display: flex; align-items: center; justify-content: center; cursor: pointer; color: var(--muted); transition: all 0.15s; font-size: 14px; }
.icon-btn:hover { color: var(--text); border-color: var(--muted2); background: rgba(255,255,255,0.05); }
.icon-btn.danger:hover { color: var(--red); border-color: var(--red); }

/* PAYMENT BADGE ON SHOOT ROW */
.pay-info { text-align: right; flex-shrink: 0; }
.pay-amount { font-size: 13px; font-weight: 600; color: var(--text); }
.pay-part { font-size: 11px; color: var(--green); margin-top: 2px; }
.pay-balance { font-size: 11px; color: var(--muted); }

/* UPCOMING LIST */
.upcoming-list { display: flex; flex-direction: column; gap: 4px; max-height: 360px; overflow-y: auto; }

/* DASHBOARD TWO-COL */
.dash-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
@media (max-width: 700px) { .dash-grid { grid-template-columns: 1fr; } }
.dash-col { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 18px; }
.dash-col-title { font-size: 13px; font-weight: 600; color: var(--text); margin-bottom: 14px; display: flex; align-items: center; gap: 8px; }
.dash-col-title i { color: var(--gold); font-size: 16px; }

/* CALENDAR */
.cal-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; }
.cal-month { font-size: 20px; font-weight: 600; color: var(--text); }
.cal-nav { display: flex; gap: 8px; }
.cal-nav-btn { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius-sm); width: 34px; height: 34px; display: flex; align-items: center; justify-content: center; cursor: pointer; color: var(--muted); transition: all 0.15s; font-size: 16px; }
.cal-nav-btn:hover { color: var(--gold); border-color: var(--gold); }
.cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
.cal-dow { text-align: center; font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); padding: 8px 0; }
.cal-cell { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius-sm); min-height: 72px; padding: 8px; cursor: pointer; transition: all 0.15s; position: relative; }
.cal-cell:hover { border-color: var(--gold); }
.cal-cell.other-month { opacity: 0.35; }
.cal-cell.today { border-color: var(--gold); }
.cal-cell.selected { border-color: var(--gold); background: rgba(201,169,110,0.08); }
.cal-day { font-size: 13px; font-weight: 500; color: var(--text); margin-bottom: 4px; }
.cal-cell.today .cal-day { color: var(--gold); }
.cal-dots { display: flex; flex-wrap: wrap; gap: 3px; }
.cal-dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }
.cal-day-panel { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 18px; margin-top: 16px; }
.cal-day-panel-title { font-size: 15px; font-weight: 600; color: var(--text); margin-bottom: 14px; display: flex; align-items: center; justify-content: space-between; }
.add-shoot-prompt { display: flex; flex-direction: column; align-items: center; gap: 10px; padding: 24px; color: var(--muted); text-align: center; }
.btn-outline { display: flex; align-items: center; gap: 6px; padding: 7px 14px; border-radius: var(--radius-sm); border: 1px solid var(--border); background: none; color: var(--text); font-size: 13px; cursor: pointer; font-family: inherit; transition: all 0.15s; }
.btn-outline:hover { border-color: var(--gold); color: var(--gold); }

/* SHOOTS LIST */
.shoots-toolbar { display: flex; gap: 10px; margin-bottom: 18px; flex-wrap: wrap; }
.search-box { flex: 1; min-width: 180px; display: flex; align-items: center; gap: 8px; background: var(--card); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 0 12px; }
.search-box i { color: var(--muted); font-size: 16px; }
.search-box input { background: none; border: none; outline: none; color: var(--text); font-size: 13px; width: 100%; padding: 8px 0; font-family: inherit; }
.search-box input::placeholder { color: var(--muted2); }
select.filter-sel { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius-sm); color: var(--text); font-size: 13px; padding: 8px 12px; outline: none; cursor: pointer; font-family: inherit; }
select.filter-sel option { background: #1a1a1a; }
.shoots-list { display: flex; flex-direction: column; gap: 4px; }
.empty-state { display: flex; flex-direction: column; align-items: center; gap: 10px; padding: 48px 24px; color: var(--muted); text-align: center; }
.empty-state i { font-size: 36px; color: var(--muted2); }

/* SETTINGS */
.settings-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
@media (max-width: 600px) { .settings-grid { grid-template-columns: 1fr; } }
.settings-card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 18px; }
.settings-card-title { font-size: 14px; font-weight: 600; color: var(--text); margin-bottom: 14px; display: flex; align-items: center; gap: 8px; }
.settings-card-title i { color: var(--gold); }
.settings-item { display: flex; align-items: center; justify-content: space-between; padding: 9px 0; border-bottom: 1px solid var(--border); }
.settings-item:last-child { border-bottom: none; }
.settings-item-name { font-size: 13px; color: var(--text); }
.settings-item-tag { font-size: 11px; color: var(--muted); background: rgba(255,255,255,0.05); padding: 2px 6px; border-radius: 4px; }
.settings-actions { display: flex; gap: 6px; }
.add-item-row { display: flex; gap: 8px; margin-top: 14px; }
.add-item-input { flex: 1; background: var(--card2); border: 1px solid var(--border); border-radius: var(--radius-sm); color: var(--text); font-size: 13px; padding: 8px 12px; outline: none; font-family: inherit; }
.add-item-input:focus { border-color: var(--gold); }
.btn-add { background: var(--gold); color: #0a0a0a; border: none; border-radius: var(--radius-sm); padding: 8px 14px; font-size: 13px; font-weight: 600; cursor: pointer; font-family: inherit; white-space: nowrap; }
.btn-add:hover { background: var(--gold2); }

/* MODAL */
.modal-backdrop { position: fixed; inset: 0; background: rgba(0,0,0,0.8); z-index: 200; display: flex; align-items: center; justify-content: center; padding: 20px; opacity: 0; pointer-events: none; transition: opacity 0.2s; }
.modal-backdrop.open { opacity: 1; pointer-events: all; }
.modal { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); width: 100%; max-width: 540px; max-height: 90vh; overflow-y: auto; transform: translateY(12px); transition: transform 0.2s; }
.modal-backdrop.open .modal { transform: translateY(0); }
.modal-header { display: flex; align-items: center; justify-content: space-between; padding: 18px 20px; border-bottom: 1px solid var(--border); }
.modal-title { font-size: 16px; font-weight: 600; color: var(--text); }
.modal-close { background: none; border: none; color: var(--muted); cursor: pointer; font-size: 20px; padding: 2px; line-height: 1; }
.modal-close:hover { color: var(--text); }
.modal-body { padding: 20px; display: flex; flex-direction: column; gap: 14px; }
.modal-footer { padding: 16px 20px; border-top: 1px solid var(--border); display: flex; align-items: center; justify-content: flex-end; gap: 8px; }
.form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.form-group { display: flex; flex-direction: column; gap: 5px; }
.form-label { font-size: 11px; text-transform: uppercase; letter-spacing: 0.07em; color: var(--muted); }
.form-input { background: var(--card2); border: 1px solid var(--border); border-radius: var(--radius-sm); color: var(--text); font-size: 13px; padding: 9px 12px; outline: none; font-family: inherit; width: 100%; }
.form-input:focus { border-color: var(--gold); }
.form-input option { background: #1a1a1a; }
textarea.form-input { resize: vertical; min-height: 72px; }
.btn-primary { background: var(--gold); color: #0a0a0a; border: none; border-radius: var(--radius-sm); padding: 9px 18px; font-size: 13px; font-weight: 600; cursor: pointer; font-family: inherit; transition: all 0.15s; }
.btn-primary:hover { background: var(--gold2); }
.btn-secondary { background: none; border: 1px solid var(--border); border-radius: var(--radius-sm); color: var(--text); padding: 9px 16px; font-size: 13px; cursor: pointer; font-family: inherit; transition: all 0.15s; }
.btn-secondary:hover { border-color: var(--muted); }
.btn-danger { background: rgba(239,68,68,0.15); border: 1px solid rgba(239,68,68,0.3); color: var(--red); border-radius: var(--radius-sm); padding: 9px 16px; font-size: 13px; cursor: pointer; font-family: inherit; transition: all 0.15s; }
.btn-danger:hover { background: rgba(239,68,68,0.25); }
.btn-danger-solid { background: var(--red); border: none; color: #fff; border-radius: var(--radius-sm); padding: 9px 18px; font-size: 13px; font-weight: 600; cursor: pointer; font-family: inherit; }
.btn-danger-solid:hover { opacity: 0.85; }

/* CONFIRM MODAL */
.confirm-modal { max-width: 360px; }
.confirm-body { padding: 24px 20px; text-align: center; }
.confirm-icon { font-size: 36px; color: var(--red); margin-bottom: 12px; }
.confirm-title { font-size: 15px; font-weight: 600; color: var(--text); margin-bottom: 6px; }
.confirm-sub { font-size: 13px; color: var(--muted); }

/* TABS within section */
.inner-tabs { display: flex; gap: 4px; margin-bottom: 20px; background: var(--card); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 4px; width: fit-content; }
.inner-tab { padding: 6px 14px; border-radius: 4px; font-size: 13px; color: var(--muted); cursor: pointer; transition: all 0.15s; border: none; background: none; font-family: inherit; }
.inner-tab.active { background: var(--card2); color: var(--gold); }

/* DIVIDER */
.divider { height: 1px; background: var(--border); margin: 4px 0; }

/* PART PAYMENT HIGHLIGHT */
.part-payment-box { background: rgba(168,85,247,0.08); border: 1px solid rgba(168,85,247,0.25); border-radius: var(--radius-sm); padding: 10px 12px; display: flex; flex-direction: column; gap: 4px; }
.part-payment-box .form-label { color: var(--purple); }

@media (max-width: 768px) {
  .topbar {
    padding: 10px;
    height: auto;
    flex-direction: column;
    gap: 10px;
  }

  .topbar-nav {
    width: 100%;
    overflow-x: auto;
    padding-bottom: 4px;
  }

  .main {
    padding: 14px;
  }

  .shoot-row {
    align-items: flex-start;
    flex-wrap: wrap;
  }

  .pay-info {
    width: 100%;
    text-align: left;
    margin-left: 58px;
  }

  .form-row {
    grid-template-columns: 1fr;
  }

  .modal {
    max-width: 100%;
  }

  .settings-grid {
    grid-template-columns: 1fr;
  }
}

</style>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

</head>
<body>

<!-- TOPBAR -->
<div class="topbar">
  <div class="logo"><i class="ti ti-aperture"></i> Studio OS</div>
  <div class="topbar-nav">
    <button class="nav-tab active" onclick="switchTab('dashboard')" id="tab-dashboard"><i class="ti ti-layout-dashboard"></i> Dashboard</button>
    <button class="nav-tab" onclick="switchTab('calendar')" id="tab-calendar"><i class="ti ti-calendar"></i> Calendar</button>
    <button class="nav-tab" onclick="switchTab('shoots')" id="tab-shoots"><i class="ti ti-camera"></i> Shoots</button>
    <button class="nav-tab" onclick="switchTab('payments')" id="tab-payments"><i class="ti ti-wallet"></i> Payments</button>
    <button class="nav-tab" onclick="switchTab('settings')" id="tab-settings"><i class="ti ti-settings"></i> Settings</button>
  </div>
  <div class="topbar-right">
    <button class="btn-new" onclick="openAddShootModal()"><i class="ti ti-plus"></i> New Shoot</button>
  </div>
</div>

<div class="main">

  <!-- ===== DASHBOARD ===== -->
  <div class="section active" id="section-dashboard">
    <div class="page-header">
      <div class="page-title">Dashboard</div>
      <div class="page-sub" id="dash-date"></div>
    </div>
    <div class="stat-grid" id="dash-stats"></div>
    <div class="dash-grid">
      <div class="dash-col">
        <div class="dash-col-title"><i class="ti ti-calendar-event"></i> Upcoming Shoots</div>
        <div class="upcoming-list" id="dash-upcoming"></div>
      </div>
      <div class="dash-col">
        <div class="dash-col-title"><i class="ti ti-wallet"></i> Payment Summary</div>
        <div id="dash-payments"></div>
      </div>
    </div>
  </div>

  <!-- ===== CALENDAR ===== -->
  <div class="section" id="section-calendar">
    <div class="page-header" style="margin-bottom:16px">
      <div class="cal-header">
        <div class="cal-month" id="cal-month-label"></div>
        <div class="cal-nav">
          <button class="cal-nav-btn" onclick="calPrev()"><i class="ti ti-chevron-left"></i></button>
          <button class="cal-nav-btn" onclick="calToday()"><i class="ti ti-calendar"></i></button>
          <button class="cal-nav-btn" onclick="calNext()"><i class="ti ti-chevron-right"></i></button>
        </div>
      </div>
    </div>
    <div class="cal-grid" id="cal-grid"></div>
    <div id="cal-day-panel" style="display:none"></div>
  </div>

  <!-- ===== SHOOTS ===== -->
  <div class="section" id="section-shoots">
    <div class="page-header">
      <div class="page-title">All Shoots</div>
    </div>
    <div class="shoots-toolbar">
      <div class="search-box"><i class="ti ti-search"></i><input type="text" id="shoot-search" placeholder="Search client, location…" oninput="renderShootsList()"/></div>
      <select class="filter-sel" id="filter-company" onchange="renderShootsList()"><option value="">All Companies</option></select>
      <select class="filter-sel" id="filter-event" onchange="renderShootsList()"><option value="">All Events</option></select>
      <select class="filter-sel" id="filter-loc" onchange="renderShootsList()"><option value="">All Locations</option></select>
    </div>
    <div class="shoots-list" id="shoots-list"></div>
  </div>

  <!-- ===== PAYMENTS ===== -->
  <div class="section" id="section-payments">
    <div class="page-header">
      <div class="page-title">Payment Tracker</div>
    </div>
    <div class="stat-grid" id="pay-stats"></div>
    <div class="shoots-toolbar">
      <div class="search-box"><i class="ti ti-search"></i><input type="text" id="pay-search" placeholder="Search client…" oninput="renderPaymentsList()"/></div>
      <select class="filter-sel" id="pay-filter-status" onchange="renderPaymentsList()">
        <option value="">All Statuses</option>
        <option value="pending">Pending</option>
        <option value="part">Part Payment</option>
        <option value="done">Done</option>
      </select>
    </div>
    <div class="shoots-list" id="payments-list"></div>
  </div>

  <!-- ===== SETTINGS ===== -->
  <div class="section" id="section-settings">
    <div class="page-header">
      <div class="page-title">Settings</div>
    </div>
    <div class="settings-grid">
      <div class="settings-card">
        <div class="settings-card-title"><i class="ti ti-building"></i> Companies</div>
        <div id="settings-companies"></div>
        <div class="add-item-row">
          <input class="add-item-input" type="text" id="new-company-input" placeholder="Add company…"/>
          <button class="btn-add" onclick="addCompany()">Add</button>
        </div>
      </div>
      <div class="settings-card">

<script>

function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2); }

function fmtDate(d) {
  if (!d) return '';

}
function fmtAmt(n) { return '₹' + Number(n||0).toLocaleString('en-IN'); }
function eventColor(ev) { return EVENT_COLORS[ev] || '#6b7280'; }
function eventBadgeClass(ev) {
  const map = {'Wedding':'badge-wedding','Reception':'badge-reception','Sangeet':'badge-sangeet','Haldi':'badge-haldi','Pellikoduku':'badge-pellikoduku','Pellikuthuru':'badge-pellikuthuru','House Warming':'badge-house-warming'};

}
function payBadgeClass(s) { return {'pending':'badge-pending','part':'badge-part','done':'badge-done'}[s]||'badge-pending'; }
function payLabel(s) { return {'pending':'Pending','part':'Part Payment','done':'Done'}[s]||'Pending'; }
function ddMmm(d) {
  if (!d) return {dd:'',mmm:''};
  const dt = new Date(d+'T00:00:00');
  return { dd: dt.getDate(), mmm: ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][dt.getMonth()] };

// ─── DASHBOARD ───────────────────────────────────────────────────────────────
function renderDashboard() {
  const shoots = getShoots();

  const thisMonth = shoots.filter(s => s.date && s.date.startsWith(monthStr)).length;
  const upcoming = shoots.filter(s => s.date >= td).length;
  const next7 = shoots.filter(s => s.date >= td && s.date <= in7str).length;

  document.getElementById('dash-stats').innerHTML = `
    <div class="stat-card gold"><div class="stat-label">Total Shoots</div><div class="stat-value">${shoots.length}</div><div class="stat-sub">all time</div></div>
    <div class="stat-card blue"><div class="stat-label">This Month</div><div class="stat-value">${thisMonth}</div><div class="stat-sub">${MONTHS[now.getMonth()]}</div></div>
    <div class="stat-card purple"><div class="stat-label">Upcoming</div><div class="stat-value">${upcoming}</div><div class="stat-sub">from today</div></div>
    <div class="stat-card green"><div class="stat-label">Next 7 Days</div><div class="stat-value">${next7}</div><div class="stat-sub">shoots ahead</div></div>
  `;

  const upcomingList = shoots.filter(s => s.date >= td).sort((a,b) => a.date.localeCompare(b.date)).slice(0,15);
  const ul = document.getElementById('dash-upcoming');
  if (!upcomingList.length) {
    ul.innerHTML = '<div class="empty-state"><i class="ti ti-calendar-off"></i><span>No upcoming shoots</span></div>';
  } else {
    ul.innerHTML = upcomingList.map(s => shootRowHTML(s, true)).join('');
  }

  // Payment summary
  const totalAmt = shoots.reduce((a,s)=>a+Number(s.amount||0),0);
  const received = shoots.reduce((a,s)=>{
    if (s.payStatus==='done') return a+Number(s.amount||0);
    if (s.payStatus==='part') return a+Number(s.partPaid||0);
    return a;
  },0);
  const outstanding = totalAmt - received;
  const doneCount = shoots.filter(s=>s.payStatus==='done').length;
  const partCount = shoots.filter(s=>s.payStatus==='part').length;
  const pendingCount = shoots.filter(s=>!s.payStatus||s.payStatus==='pending').length;

  document.getElementById('dash-payments').innerHTML = `
    <div style="display:flex;flex-direction:column;gap:10px">
      <div style="display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--border)">

        <span style="font-weight:600;font-size:15px">${fmtAmt(totalAmt)}</span>

      <div style="display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--border)">
        <span style="color:var(--muted);font-size:13px">Received</span>
        <span style="font-weight:600;font-size:15px;color:var(--green)">${fmtAmt(received)}</span>
      </div>
      <div style="display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--border)">
        <span style="color:var(--muted);font-size:13px">Outstanding</span>
        <span style="font-weight:600;font-size:15px;color:var(--amber)">${fmtAmt(outstanding)}</span>
      </div>
      <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:4px">
        <span class="badge badge-done">${doneCount} Paid</span>
        <span class="badge badge-part">${partCount} Part paid</span>
        <span class="badge badge-pending">${pendingCount} Pending</span>
      </div>
    </div>
  `;
}

// ─── SHOOT ROW HTML ───────────────────────────────────────────────────────────
function shootRowHTML(s, hideActions) {
  const {dd, mmm} = ddMmm(s.date);
  const balance = Number(s.amount||0) - Number(s.partPaid||0);
  const payInfo = s.amount ? `

    </div>` : '';
  const actions = hideActions ? '' : `
    <div class="shoot-row-actions">
      <button class="icon-btn" onclick="event.stopPropagation();openEditShootModal('${s.id}')" title="Edit"><i class="ti ti-edit"></i></button>
      <button class="icon-btn danger" onclick="event.stopPropagation();askDelete('${s.id}')" title="Delete"><i class="ti ti-trash"></i></button>

  return `
    <div class="shoot-row" onclick="openEditShootModal('${s.id}')">
      <div class="date-box"><div class="dd">${dd}</div><div class="mmm">${mmm}</div></div>
      <div class="shoot-row-info">

      </div>
      <span class="badge ${eventBadgeClass(s.event)}" style="flex-shrink:0">${s.event||'Other'}</span>
      ${payInfo}

}

// ─── CALENDAR ────────────────────────────────────────────────────────────────
let calYear = new Date().getFullYear();
let calMonth = new Date().getMonth();
let calSelected = null;

function renderCalendar() {
  const shoots = getShoots();
  const td = today();
  document.getElementById('cal-month-label').textContent = MONTHS[calMonth] + ' ' + calYear;

  const firstDay = new Date(calYear, calMonth, 1).getDay();
  const daysInMonth = new Date(calYear, calMonth+1, 0).getDate();
  const daysInPrev = new Date(calYear, calMonth, 0).getDate();

  let html = DAYS.map(d => `<div class="cal-dow">${d}</div>`).join('');

  const shootsByDate = {};
  shoots.forEach(s => {
    if (!s.date) return;
    if (!shootsByDate[s.date]) shootsByDate[s.date] = [];
    shootsByDate[s.date].push(s);
  });

  let cells = [];
  for (let i = 0; i < firstDay; i++) {
    const d = daysInPrev - firstDay + 1 + i;
    cells.push({ day: d, month: calMonth - 1, year: calYear, other: true });
  }
  for (let d = 1; d <= daysInMonth; d++) {
    cells.push({ day: d, month: calMonth, year: calYear, other: false });
  }
  const rem = 42 - cells.length;
  for (let d = 1; d <= rem; d++) {
    cells.push({ day: d, month: calMonth + 1, year: calYear, other: true });
  }

  cells.forEach(c => {
    const mm = String(c.month + 1).padStart(2,'0');
    const dd = String(c.day).padStart(2,'0');
    const yr = c.month < 0 ? c.year - 1 : (c.month > 11 ? c.year + 1 : c.year);
    const realMm = c.month < 0 ? 12 : (c.month > 11 ? 1 : c.month + 1);
    const dateStr = yr + '-' + String(realMm).padStart(2,'0') + '-' + dd;
    const isToday = dateStr === td;
    const isSelected = dateStr === calSelected;
    const dayShoots = shootsByDate[dateStr] || [];
    const dots = dayShoots.map(s => `<div class="cal-dot" style="background:${eventColor(s.event)}"></div>`).join('');
    html += `<div class="cal-cell${c.other?' other-month':''}${isToday?' today':''}${isSelected?' selected':''}" onclick="selectCalDay('${dateStr}')">
      <div class="cal-day">${c.day}</div>
      <div class="cal-dots">${dots}</div>
    </div>`;
  });

  document.getElementById('cal-grid').innerHTML = html;
  renderCalDayPanel();
}

function selectCalDay(dateStr) {
  calSelected = calSelected === dateStr ? null : dateStr;
  renderCalendar();
}

function renderCalDayPanel() {
  const panel = document.getElementById('cal-day-panel');
  if (!calSelected) { panel.style.display = 'none'; return; }
  const shoots = getShoots().filter(s => s.date === calSelected);
  const dt = new Date(calSelected + 'T00:00:00');
  const label = dt.toLocaleDateString('en-IN',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
  panel.style.display = 'block';
  let inner = `<div class="cal-day-panel-title"><span>${label}</span><button class="btn-outline" onclick="openAddShootModal('${calSelected}')"><i class="ti ti-plus"></i> Add Shoot</button></div>`;
  if (!shoots.length) {
    inner += `<div class="add-shoot-prompt"><i class="ti ti-camera-off" style="font-size:28px;color:var(--muted2)"></i><span style="font-size:13px">No shoots on this day</span></div>`;
  } else {
    inner += shoots.map(s => shootRowHTML(s, false)).join('');
  }
  panel.innerHTML = `<div class="cal-day-panel">${inner}</div>`;
}

function calPrev() { calMonth--; if (calMonth < 0) { calMonth = 11; calYear--; } renderCalendar(); }
function calNext() { calMonth++; if (calMonth > 11) { calMonth = 0; calYear++; } renderCalendar(); }
function calToday() { calYear = new Date().getFullYear(); calMonth = new Date().getMonth(); calSelected = today(); renderCalendar(); }

// ─── SHOOTS LIST ──────────────────────────────────────────────────────────────
function renderShootsList() {
  const q = (document.getElementById('shoot-search')?.value||'').toLowerCase();
  const fc = document.getElementById('filter-company')?.value||'';
  const fe = document.getElementById('filter-event')?.value||'';
  const fl = document.getElementById('filter-loc')?.value||'';

  // Populate filters

  const events = ['Wedding','Reception','Sangeet','Haldi','Pellikoduku','Pellikuthuru','House Warming','Other'];
  const ee = document.getElementById('filter-event');
  const curE = ee.value;
  ee.innerHTML = '<option value="">All Events</option>' + events.map(e=>`<option value="${e}" ${e===curE?'selected':''}>${e}</option>`).join('');

  const le = document.getElementById('filter-loc');

  let shoots = getShoots().sort((a,b) => (b.date||'').localeCompare(a.date||''));

// ─── PAYMENTS ────────────────────────────────────────────────────────────────
function renderPayments() {
  const shoots = getShoots();
  const totalAmt = shoots.reduce((a,s)=>a+Number(s.amount||0),0);
  const received = shoots.reduce((a,s)=>{
    if (s.payStatus==='done') return a+Number(s.amount||0);
    if (s.payStatus==='part') return a+Number(s.partPaid||0);
    return a;
  },0);
  const outstanding = shoots.reduce((a,s)=>{
    if (s.payStatus==='done') return a;
    if (s.payStatus==='part') return a + (Number(s.amount||0) - Number(s.partPaid||0));
    return a + Number(s.amount||0);
  },0);
  const partTotal = shoots.filter(s=>s.payStatus==='part').reduce((a,s)=>a+Number(s.partPaid||0),0);

  document.getElementById('pay-stats').innerHTML = `

    <div class="stat-card green"><div class="stat-label">Total Received</div><div class="stat-value" style="font-size:20px">${fmtAmt(received)}</div><div class="stat-sub">fully paid + part paid</div></div>

    <div class="stat-card purple"><div class="stat-label">Part Payments</div><div class="stat-value" style="font-size:20px">${fmtAmt(partTotal)}</div><div class="stat-sub">${shoots.filter(s=>s.payStatus==='part').length} shoots</div></div>

    const {dd, mmm} = ddMmm(s.date);

    return `<div class="shoot-row" onclick="openEditShootModal('${s.id}')">

      <div class="pay-info" style="text-align:right">
        <div style="font-size:15px;font-weight:600">${fmtAmt(s.amount)}</div>
        ${s.payStatus==='part' ? `<div style="font-size:12px;color:var(--green);margin-top:2px">${fmtAmt(s.partPaid||0)} received</div><div style="font-size:11px;color:var(--muted)">${fmtAmt(balance)} due</div>` : ''}
        <div style="margin-top:4px"><span class="badge ${payBadgeClass(s.payStatus||'pending')}">${payLabel(s.payStatus||'pending')}</span></div>
      </div>
      <div class="shoot-row-actions">
        <button class="icon-btn" onclick="event.stopPropagation();openEditShootModal('${s.id}')" title="Edit"><i class="ti ti-edit"></i></button>
        <button class="icon-btn danger" onclick="event.stopPropagation();askDelete('${s.id}')" title="Delete"><i class="ti ti-trash"></i></button>
      </div>
    </div>`;
  }).join('');
}

// ─── SETTINGS ────────────────────────────────────────────────────────────────
function renderSettings() {
  const companies = getCompanies();
  const customLocs = getLocs();

  document.getElementById('settings-companies').innerHTML = companies.map((c,i) => `
    <div class="settings-item">
      <span class="settings-item-name">${c}</span>
      <div class="settings-actions">
        <button class="icon-btn" onclick="renameCompany(${i})" title="Rename"><i class="ti ti-pencil"></i></button>
        <button class="icon-btn danger" onclick="deleteCompany(${i})" title="Delete"><i class="ti ti-trash"></i></button>
      </div>
    </div>`).join('');

  const locHTML = DEFAULT_LOCS.map(l => `
    <div class="settings-item">
      <span class="settings-item-name">${l}</span>
      <span class="settings-item-tag">default</span>
    </div>`).join('') +
    customLocs.map((l,i) => `
    <div class="settings-item">
      <span class="settings-item-name">${l}</span>
      <div class="settings-actions">
        <button class="icon-btn" onclick="renameLocation(${i})" title="Rename"><i class="ti ti-pencil"></i></button>
        <button class="icon-btn danger" onclick="deleteLocation(${i})" title="Delete"><i class="ti ti-trash"></i></button>
      </div>
    </div>`).join('');

  document.getElementById('settings-locations').innerHTML = locHTML;
}

function addCompany() {
  const val = document.getElementById('new-company-input').value.trim();
  if (!val) return;
  const list = getCompanies(); list.push(val); saveCompanies(list);
  document.getElementById('new-company-input').value = '';
  renderSettings();
}
function deleteCompany(i) {
  const list = getCompanies(); list.splice(i,1); saveCompanies(list); renderSettings();
}
function renameCompany(i) {
  const list = getCompanies();
  const newName = prompt('Rename company:', list[i]);
  if (!newName || newName === list[i]) return;
  const old = list[i]; list[i] = newName; saveCompanies(list);
  const shoots = getShoots().map(s => s.company === old ? {...s, company: newName} : s); saveShoots(shoots);
  renderSettings();
}
function addLocation() {
  const val = document.getElementById('new-loc-input').value.trim();
  if (!val) return;
  if (DEFAULT_LOCS.includes(val)) return;
  const list = getLocs(); if (!list.includes(val)) { list.push(val); saveLocs(list); }
  document.getElementById('new-loc-input').value = '';
  renderSettings();
}
function deleteLocation(i) {
  const list = getLocs(); list.splice(i,1); saveLocs(list); renderSettings();
}
function renameLocation(i) {
  const list = getLocs();
  const newName = prompt('Rename location:', list[i]);
  if (!newName || newName === list[i]) return;
  const old = list[i]; list[i] = newName; saveLocs(list);
  const shoots = getShoots().map(s => s.location === old ? {...s, location: newName} : s); saveShoots(shoots);
  renderSettings();
}

// ─── MODAL ────────────────────────────────────────────────────────────────────
function openAddShootModal(prefillDate) {
  resetModal();
  document.getElementById('shoot-modal-title').textContent = 'New Shoot';
  document.getElementById('modal-delete-btn').style.display = 'none';
  document.getElementById('f-shoot-date').value = prefillDate || today();
  populateModalDropdowns();
  openModal('shoot-modal-backdrop');
}

function openEditShootModal(id) {
  const shoots = getShoots();
  const s = shoots.find(x => x.id === id);
  if (!s) return;
  resetModal();
  document.getElementById('shoot-modal-title').textContent = 'Edit Shoot';
  document.getElementById('modal-delete-btn').style.display = 'inline-flex';
  document.getElementById('edit-shoot-id').value = id;
  populateModalDropdowns(s);
  document.getElementById('f-shoot-name').value = s.name || '';
  document.getElementById('f-shoot-date').value = s.date || '';
  document.getElementById('f-shoot-session').value = s.session || 'Morning Session';
  document.getElementById('f-shoot-notes').value = s.notes || '';
  document.getElementById('f-shoot-amount').value = s.amount || '';
  document.getElementById('f-shoot-pay-status').value = s.payStatus || 'pending';
  document.getElementById('f-shoot-part-paid').value = s.partPaid || '';
  document.getElementById('f-part-pay-wrap').style.display = s.payStatus === 'part' ? '' : 'none';

  // Event
  const events = ['Wedding','Reception','Sangeet','Haldi','Pellikoduku','Pellikuthuru','House Warming','Other'];
  if (s.event && !events.includes(s.event)) {
    document.getElementById('f-shoot-event').value = 'Other';
    document.getElementById('f-shoot-event-other').value = s.event;
    document.getElementById('f-event-other-wrap').style.display = '';
  } else {
    document.getElementById('f-shoot-event').value = s.event || 'Wedding';
    document.getElementById('f-event-other-wrap').style.display = 'none';
  }

  openModal('shoot-modal-backdrop');
}

function populateModalDropdowns(s) {
  const companies = getCompanies();
  const locs = allLocs();
  const compSel = document.getElementById('f-shoot-company');
  compSel.innerHTML = companies.map(c => `<option value="${c}">${c}</option>`).join('');
  if (s && s.company) compSel.value = s.company;

  const locSel = document.getElementById('f-shoot-loc');
  locSel.innerHTML = locs.map(l => `<option value="${l}">${l}</option>`).join('') + '<option value="__other__">Other (specify below)</option>';
  if (s && s.location) {
    if (locs.includes(s.location)) { locSel.value = s.location; document.getElementById('f-loc-other-wrap').style.display = 'none'; }
    else { locSel.value = '__other__'; document.getElementById('f-shoot-loc-other').value = s.location; document.getElementById('f-loc-other-wrap').style.display = ''; }
  }
}

function resetModal() {
  document.getElementById('edit-shoot-id').value = '';
  document.getElementById('f-shoot-name').value = '';
  document.getElementById('f-shoot-date').value = '';
  document.getElementById('f-shoot-event').value = 'Wedding';
  document.getElementById('f-shoot-event-other').value = '';
  document.getElementById('f-event-other-wrap').style.display = 'none';
  document.getElementById('f-shoot-session').value = 'Morning Session';
  document.getElementById('f-shoot-loc-other').value = '';
  document.getElementById('f-loc-other-wrap').style.display = 'none';
  document.getElementById('f-shoot-notes').value = '';
  document.getElementById('f-shoot-amount').value = '';
  document.getElementById('f-shoot-pay-status').value = 'pending';
  document.getElementById('f-shoot-part-paid').value = '';
  document.getElementById('f-part-pay-wrap').style.display = 'none';
}

function handleEventOther() {
  const v = document.getElementById('f-shoot-event').value;
  document.getElementById('f-event-other-wrap').style.display = v === 'Other' ? '' : 'none';
}
function handleLocOther() {
  const v = document.getElementById('f-shoot-loc').value;
  document.getElementById('f-loc-other-wrap').style.display = v === '__other__' ? '' : 'none';
}
function handlePayStatusChange() {
  const v = document.getElementById('f-shoot-pay-status').value;
  document.getElementById('f-part-pay-wrap').style.display = v === 'part' ? '' : 'none';
}

async function saveShoot() {
  const name = document.getElementById('f-shoot-name').value.trim();
  const date = document.getElementById('f-shoot-date').value;

  if (!name) {
    document.getElementById('f-shoot-name').focus();
    return;
  }

  if (!date) {
    document.getElementById('f-shoot-date').focus();
    return;
  }

  let event = document.getElementById('f-shoot-event').value;

  if (event === 'Other') {
    event = document.getElementById('f-shoot-event-other').value.trim() || 'Other';
  }

  let location = document.getElementById('f-shoot-loc').value;

  if (location === '__other__') {
    location = document.getElementById('f-shoot-loc-other').value.trim();
  }

  const payStatus = document.getElementById('f-shoot-pay-status').value;
  const amount = parseFloat(document.getElementById('f-shoot-amount').value) || 0;

  const partPaid = payStatus === 'part'
    ? (parseFloat(document.getElementById('f-shoot-part-paid').value) || 0)
    : (payStatus === 'done' ? amount : 0);

  const payload = {
    name,
    date,
    event,
    session: document.getElementById('f-shoot-session').value,
    location,
    company: document.getElementById('f-shoot-company').value,
    notes: document.getElementById('f-shoot-notes').value.trim(),
    amount,
    pay_status: payStatus,
    part_paid: partPaid
  };

  const editId = document.getElementById('edit-shoot-id').value;

  let response;

  if (editId) {
    response = await supabaseClient
      .from('shoots')
      .update(payload)
      .eq('id', editId);
  } else {
    response = await supabaseClient
      .from('shoots')
      .insert(payload);
  }

  if (response.error) {
    console.error(response.error);
    alert('Failed saving shoot');
    return;
  }

  closeShootModal();
  await refreshData();
}

function refreshCurrentTab() {
  const active = document.querySelector('.nav-tab.active');
  if (!active) return;
  const tab = active.id.replace('tab-','');
  if (tab === 'dashboard') renderDashboard();
  if (tab === 'calendar') renderCalendar();
  if (tab === 'shoots') renderShootsList();
  if (tab === 'payments') renderPayments();
}

function triggerDeleteFromModal() {
  const id = document.getElementById('edit-shoot-id').value;
  if (id) { closeShootModal(); setTimeout(() => askDelete(id), 100); }
}

// ─── DELETE ───────────────────────────────────────────────────────────────────
let pendingDeleteId = null;
function askDelete(id) {
  const s = getShoots().find(x => x.id === id);
  if (!s) return;
  pendingDeleteId = id;
  document.getElementById('confirm-sub-text').textContent = `"${s.name}" on ${fmtDate(s.date)} will be permanently deleted.`;
  openModal('confirm-modal-backdrop');
}
async function confirmDelete() {
  if (!pendingDeleteId) return;

  const { error } = await supabaseClient
    .from('shoots')
    .delete()
    .eq('id', pendingDeleteId);

  if (error) {
    console.error(error);
    alert('Failed deleting shoot');
    return;
  }

  pendingDeleteId = null;
  closeConfirmModal();
  await refreshData();
}
function closeConfirmModal() { closeModal('confirm-modal-backdrop'); pendingDeleteId = null; }

// ─── MODAL HELPERS ────────────────────────────────────────────────────────────
function openModal(id) { document.getElementById(id).classList.add('open'); document.body.style.overflow = 'hidden'; }
function closeModal(id) { document.getElementById(id).classList.remove('open'); document.body.style.overflow = ''; }
function closeShootModal() { closeModal('shoot-modal-backdrop'); }
function handleBackdropClick(e, id) { if (e.target === document.getElementById(id)) closeModal(id); }

// ─── INIT ─────────────────────────────────────────────────────────────────────
async function initApp() {
  await refreshData();

  supabaseClient
    .channel('realtime-shoots')
    .on(
      'postgres_changes',
      { event: '*', schema: 'public', table: 'shoots' },
      async () => {
        await refreshData();
      }
    )
    .subscribe();
}

initApp();
</script>
